name: CI with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-js-app .

      - name: Run linting inside container
        run: docker run my-js-app npm run lint

      - name: Run tests inside container
        run: docker run my-js-app npm test

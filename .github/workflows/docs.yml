name: Generate Docs

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build documentation
        run: |
          npm ci
          npm run docs

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs
